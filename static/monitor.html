<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AeroTrack — live monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Blue Eclipse — same system as the app. This page watches the bundled demo
   API: the simulator's background traffic, with the agent's calls marked. */
:root{
  --mono:"Spline Sans Mono",ui-monospace,monospace;
  --ui:"Sora",system-ui,sans-serif;
  --pill:999px; --box:12px;
  --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --bg:#05070f;--panel:#0b0f1c;--panel-2:#0f1424;--sunk:#070a13;
  --line:#171d2f;--line-2:#22293e;--line-3:#3d4767;
  --ink:#eef1f8;--ink-2:#b2b9cc;--ink-3:#949bb0;--ink-4:#7b8299;
  --acc:#5b8cff;--acc-dim:#0d1631;--acc-line:#3a5296;--acc-ink:#84a8ff;
  --err:#e0655f;--ok:#5fae8c;--warn:#c49a55;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink-2);font:400 14px/1.6 var(--ui);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
*::-webkit-scrollbar{width:10px}*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid var(--bg)}

header{display:flex;align-items:baseline;gap:var(--s4);padding:var(--s5) var(--s6) 0;
  flex-wrap:wrap}
.wm{font:700 17.5px/1 var(--ui);color:var(--ink);letter-spacing:-.035em}
.wm b{color:var(--acc);font-weight:700}
header .sub{font:400 12px/1 var(--mono);color:var(--ink-4)}
.live{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 var(--s3);
  border-radius:var(--pill);font:500 12px/1 var(--ui);
  background:var(--acc-dim);color:var(--acc-ink);border:1px solid var(--acc-line)}
.live .d{width:5px;height:5px;border-radius:50%;background:var(--acc);
  animation:pulse 1.6s steps(1,end) infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .d{animation:none}
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}}
header a{margin-left:auto;color:var(--acc-ink);font-size:14px;text-decoration:none}
header a:hover{text-decoration:underline;text-underline-offset:3px}
.asof{font:400 12px/1 var(--mono);color:var(--ink-4)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:var(--s3);
  padding:var(--s5) var(--s6) 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--box);
  padding:var(--s4)}
.tile .n{font:400 26px/1 var(--ui);color:var(--ink);letter-spacing:-.03em}
.tile .l{font:400 12px/1.4 var(--ui);color:var(--ink-4);margin-top:6px}
.tile.agent{border-color:var(--acc-line)}
.tile.agent .n{color:var(--acc-ink)}

.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:var(--s4);
  padding:var(--s4) var(--s6) var(--s6)}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--box);
  padding:var(--s4);min-height:230px;display:flex;flex-direction:column}
.card h2{font:500 12px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-4);margin-bottom:var(--s3)}
.card h2 b{color:var(--acc-ink);font-weight:500}
.scroll{overflow-y:auto;max-height:300px}
.full{grid-column:1/-1}

.req{display:flex;gap:var(--s2);align-items:baseline;padding:5px var(--s2);
  font:400 12px/1.6 var(--mono);border-bottom:1px solid var(--line);color:var(--ink-3)}
.req:last-child{border-bottom:none}
.req .t{color:var(--ink-4);flex:none}
.req.agent{background:var(--acc-dim);border-left:2px solid var(--acc);
  margin-left:-2px}
.req .who{font:500 12px/1.6 var(--mono);color:var(--acc-ink);flex:none}
.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-err{color:var(--err)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--ink-4);font:400 12px/1 var(--mono);letter-spacing:.06em;
  text-transform:uppercase;padding:0 var(--s2) var(--s2) var(--s2);
  border-bottom:1px solid var(--line-2)}
td{padding:7px var(--s2);border-bottom:1px solid var(--line);white-space:nowrap;
  color:var(--ink-3);font-family:var(--mono);font-size:12px}
tr:last-child td{border-bottom:none}
td.route{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:var(--ui)}
.chip .d{width:6px;height:6px;border-radius:50%;flex:none}
.st-created .d{background:var(--ink-4)}.st-picked_up .d{background:var(--warn)}
.st-in_transit .d,.st-out_for_delivery .d{background:var(--acc)}
.st-delivered .d{background:var(--ok)}.st-delayed .d{background:var(--err)}

.ev{display:flex;gap:var(--s2);align-items:baseline;padding:5px var(--s2);font-size:14px;
  border-bottom:1px solid var(--line);color:var(--ink-2)}
.ev:last-child{border-bottom:none}
.ev .t{font:400 12px/1.7 var(--mono);color:var(--ink-4);flex:none}
.ev.agent{background:var(--acc-dim);border-left:2px solid var(--acc);margin-left:-2px}
.empty-note{color:var(--ink-4);font-size:14px;padding:var(--s3) var(--s2)}
</style>
</head>
<body>
<header>
  <span class="wm">Aero<b>Track</b></span>
  <span class="sub">the bundled demo API · simulated logistics traffic</span>
  <span class="live"><span class="d"></span>Live</span>
  <span class="asof" id="asof"></span>
  <a href="/">← doc2agent</a>
  <a href="/demo/docs" target="_blank">API docs</a>
</header>

<div class="tiles" id="tiles" aria-live="polite"></div>

<div class="grid">
  <div class="card">
    <h2>API requests — <b>agent calls marked</b></h2>
    <div class="scroll" id="requests"></div>
  </div>
  <div class="card">
    <h2>Shipments — latest activity</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>ID</th><th>Route</th><th>Status</th><th>Priority</th>
          <th>Courier</th><th>Updated</th></tr></thead>
        <tbody id="shipments"></tbody>
      </table>
    </div>
  </div>
  <div class="card full">
    <h2>Event stream</h2>
    <div class="scroll" id="events"></div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// backend timestamps are UTC with an offset; show them in the viewer's own time
const hhmmss = iso => {
  const d = new Date(iso);
  return isNaN(d) ? (iso || "").slice(11, 19) : d.toTimeString().slice(0, 8);
};

const TILES = [
  ["total", "Total shipments"], ["in_transit", "In transit"], ["delivered", "Delivered"],
  ["delayed", "Delayed"], ["idle_couriers", "Idle couriers"], ["agent_calls", "Agent calls"],
];

function render(data) {
  $("tiles").innerHTML = TILES.map(([key, label]) =>
    `<div class="tile${key === "agent_calls" ? " agent" : ""}">
      <div class="n">${data.stats[key] ?? 0}</div><div class="l">${label}</div></div>`).join("");

  $("requests").innerHTML = data.requests.map(r => {
    const cls = r.status < 300 ? "s-ok" : r.status < 500 ? "s-warn" : "s-err";
    return `<div class="req${r.caller === "agent" ? " agent" : ""}">
      <span class="t">${hhmmss(r.time)}</span>
      ${r.caller === "agent" ? '<span class="who">AGENT</span>' : ""}
      <span>${esc(r.method)} ${esc(r.path)}</span>
      <span class="${cls}">${r.status}</span></div>`;
  }).join("") || '<div class="empty-note">No traffic yet — generate an agent and ask it something.</div>';

  $("shipments").innerHTML = data.shipments.map(s => `
    <tr><td>${esc(s.id)}</td>
    <td class="route">${esc(s.origin_city)} → ${esc(s.dest_city)}</td>
    <td><span class="chip st-${esc(s.status)}"><span class="d"></span>${esc(s.status.replace(/_/g, " "))}</span></td>
    <td>${esc(s.priority)}</td><td>${esc(s.courier_id || "—")}</td>
    <td>${hhmmss(s.updated_at)}</td></tr>`).join("");

  $("events").innerHTML = data.events.map(e =>
    `<div class="ev${e.kind === "agent" ? " agent" : ""}">
      <span class="t">${hhmmss(e.time)}</span><span>${esc(e.text)}</span></div>`).join("");

  $("asof").textContent = "as of " + new Date().toTimeString().slice(0, 8);
}

async function tick() {
  try {
    const resp = await fetch("/api/monitor/feed");
    if (resp.ok) render(await resp.json());
  } catch (e) { /* server restarting; keep polling */ }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
