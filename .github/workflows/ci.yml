name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Offline tests (ingestion goldens, safety, demo API, units)
        run: pytest evals -q

      - name: Live agent evals (skipped when GROQ_API_KEY secret is absent)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY not set — skipping live agent evals"
            exit 0
          fi
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          python -m evals.agent_evals

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-scorecard
          path: evals/scorecard.md
          if-no-files-found: ignore
